<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Таңба сақшысы</title><style>body{font-family:system-ui,Arial;background:#eef6f4;color:#143b38;margin:0;padding:18px}.wrap{max-width:650px;margin:auto}.card{background:white;border-radius:22px;padding:24px;box-shadow:0 8px 25px #143b3818}h1{margin:0 0 6px}small{color:#52736f}.pill{background:#d9f3e9;padding:7px 12px;border-radius:99px;display:inline-block;margin:14px 0}.question{font-size:1.4rem;font-weight:700;margin:22px 0}button{border:1px solid #b5d5cd;background:#f5fbf9;padding:14px;border-radius:13px;font-size:1.05rem;cursor:pointer;color:#143b38}button:disabled{opacity:.6}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.selected{background:#c8ecdf;border-color:#2c9277}.primary{background:#147b67;color:white;width:100%;margin-top:15px}.feedback{background:#f0f6f3;padding:12px;border-radius:12px;margin-top:15px}.progress{height:8px;background:#d9e7e3;border-radius:10px;overflow:hidden;margin-top:16px}.bar{height:100%;background:#147b67;width:0%}footer{margin-top:16px;font-size:.82rem;color:#55706b}input{padding:12px;border-radius:10px;border:1px solid #aacbc2;width:100%;box-sizing:border-box;font-size:1rem}</style></head><body><div class="wrap"><div class="card"><h1>🛡️ Таңба сақшысы</h1><small>«Жоғалған таңба: цифрлық дәуірдегі қазақ жазуы» ғылыми жобасы</small><div id="app"></div></div><footer>Жеке деректерді енгізбеңіз. Оқушы кодын ғана қолданыңыз. Нәтиже осы құрылғыда көрсетіледі, серверге жіберілмейді.</footer></div><script>
const questions=[
{q:'Аспанда ___ ай көрінді.',o:['жана','жаңа'],a:1,e:'«Жаңа» – жаңадан пайда болған деген сөз.'},
{q:'Бұл бөлме өте ___.',o:['кен','кең'],a:1,e:'«Кең» – тар емес, үлкен.'},
{q:'___ орнынан пайдалы қазба алынады.',o:['Кең','Кен'],a:1,e:'«Кен» – пайдалы қазба шоғырланған жер.'},
{q:'Ол ___ қолымен жазды.',o:['оң','он'],a:0,e:'«Оң» – солға қарама-қарсы жақ.'},
{q:'Бүгін ___ атты.',o:['тан','таң'],a:1,e:'«Таң» – күн шығатын мезгіл.'},
{q:'Мектепте алғашқы ___ соғылды.',o:['қонырау','қоңырау'],a:1,e:'«Қоңырау» сөзінде «ң» жазылады.'},
{q:'Киіз үйдің ___ биік.',o:['шанырағы','шаңырағы'],a:1,e:'«Шаңырақ» сөзінде «ң» бар.'},
{q:'Біз ___ кітап оқыдық.',o:['қызықты','қызықтың'],a:0,e:'Бұл сөйлемде «қызықты» сөзі дұрыс.'},
{q:'Ол ___ балл жинады.',o:['он','оң'],a:0,e:'«Он» – 10 саны.'},
{q:'Бүгін ауа райы ___ екен.',o:['жылы','жылың'],a:0,e:'«Жылы» сөзінің соңында «ң» болмайды.'},
{q:'Біздің ауылда ___ көп.',o:['енбекқор адам','еңбекқор адам'],a:1,e:'«Еңбек» сөзінде «ң» жазылады.'},
{q:'Күзде құстар жылы жаққа ___.',o:['ұшады','ұшадың'],a:0,e:'«Ұшады» етістігіне бұл жерде «ң» жалғанбайды.'},
{q:'Атам маған ___ айтты.',o:['әңгімені','әнгімені'],a:0,e:'«Әңгіме» сөзінде «ң» жазылады.'},
{q:'Досымның ___ көтеріңкі.',o:['көнілі','көңілі'],a:1,e:'«Көңіл» сөзінде «ң» бар.'}
];let idx=0,score=0,chosen=null,code='';const app=document.getElementById('app');function start(){code=document.getElementById('code').value.trim()||'Қатысушы';idx=0;score=0;render()}function render(){if(idx>=questions.length){app.innerHTML=`<div class="pill">Тапсырма аяқталды</div><h2>${esc(code)}: ${score} / ${questions.length} ұпай</h2><p>Нәтиже: ${Math.round(score/questions.length*100)}%</p><p>Бұл нәтиже тек жаттығуға арналған. Ғылыми зерттеу кестесіне тіркеу үшін жетекшіңізге көрсетіңіз.</p><button class="primary" onclick="restart()">Қайта бастау</button>`;return}let x=questions[idx];app.innerHTML=`<div class="pill">${idx+1} / ${questions.length} тапсырма</div><div class="progress"><div class="bar" style="width:${idx/questions.length*100}%"></div></div><div class="question">${x.q}</div><div class="options">${x.o.map((v,i)=>`<button id="o${i}" onclick="choose(${i})">${v}</button>`).join('')}</div><div id="feedback"></div><button class="primary" id="next" onclick="next()" disabled>Келесі тапсырма →</button>`}function choose(i){if(chosen!==null)return;chosen=i;const x=questions[idx];if(i===x.a)score++;document.getElementById('o'+i).classList.add('selected');document.getElementById('feedback').innerHTML=`<div class="feedback"><b>${i===x.a?'Дұрыс!':'Дұрыс жауап: '+x.o[x.a]}</b><p>${x.e}</p></div>`;document.getElementById('next').disabled=false}function next(){idx++;chosen=null;render()}function restart(){app.innerHTML='<p>Оқушының аты-жөнін емес, кодын енгізіңіз (мысалы, О1).</p><input id="code" maxlength="12" placeholder="Оқушы коды"><button class="primary" onclick="start()">Ойынды бастау →</button>'}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}restart();</script></body></html>
